server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/consulting_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    time-zone: Europe/Istanbul
    serialization:
      write-dates-as-timestamps: false
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-6
          max-tokens: 1024

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration: 900000        # 15 dakika (ms)
    refresh-expiration: 604800000  # 7 gün (ms)
  cors:
    allowed-origins: http://localhost:5173
  stripe:
    secret-key: sk_test_YOUR_STRIPE_SECRET_KEY
    webhook-secret: whsec_YOUR_WEBHOOK_SECRET
    publishable-key: pk_test_YOUR_STRIPE_PUBLISHABLE_KEY
